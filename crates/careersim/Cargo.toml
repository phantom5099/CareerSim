[package]
name = "careersim"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-openai = { version = "0.43.0", features = ["chat-completion"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
